name: Generar APK

on:
  workflow_dispatch:   # botón manual en la pestaña Actions
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Preparar web y proyecto Android
        run: |
          npm run prep
          [ -d android ] || npx cap add android
          # permiso de cámara para el escáner
          grep -q "android.permission.CAMERA" android/app/src/main/AndroidManifest.xml || \
            sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <application|' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: billing-system-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
